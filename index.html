<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test DISC del Closer · Nivel inicial · 1% Método NEO</title>
<meta name="description" content="Test DISC para quienes van a empezar en ventas: descubre qué tipo de closer vas a ser con el Método NEO.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;
  --surface:#131313;
  --surface-2:#1a1a1a;
  --surface-3:#222222;
  --ink:#f5f3ef;
  --ink-2:#c8c3ba;
  --muted:#8b867d;
  --line:#242424;
  --line-strong:#363636;
  --brand:#ff4a3f;
  --brand-deep:#d3241c;
  --brand-hover:#e8302a;
  --brand-ink:#ffffff;
  --brand-tint:color-mix(in srgb, var(--brand) 13%, transparent);
  --d:#ff4a3f;
  --i:#f0b42c;
  --s:#3fc58b;
  --c:#6e9dff;
  --focus:#ff4a3f;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.9);

  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --r-sm:8px;
  --r:12px;
  --r-lg:18px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;overflow-x:hidden;border-top:3px solid var(--brand-deep);
}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;line-height:1.08;margin:0}
p{margin:0}
ul,ol,dl,dd{margin:0;padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.av{display:block;flex:none}

/* ---------- Layout ---------- */
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.topbar{border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand-mark{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.04em;color:var(--brand);line-height:1}
.brand-sep{width:1px;height:18px;background:var(--line-strong)}
.brand-name{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.topbar-right{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#app{padding-top:48px;padding-bottom:80px}
.screen{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n, 0) * 60ms)}

.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--brand);font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.eyebrow::before{content:"";width:18px;height:2px;background:currentColor}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:0 24px;border-radius:var(--r);
  border:1px solid transparent;cursor:pointer;
  font-weight:600;font-size:16px;letter-spacing:-.005em;
  transition:background-color .15s ease, border-color .15s ease, transform .1s ease, color .15s ease;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand-deep);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn-text{background:none;border:none;min-height:44px;padding:0 4px;color:var(--ink-2);font-weight:500}
.btn-text:hover{color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn .arrow{font-family:var(--f-mono);font-weight:500;transition:transform .15s ease}
.btn:hover .arrow{transform:translateX(3px)}
.btn-text:hover .arrow-left{transform:translateX(-3px)}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;
  box-shadow:var(--shadow);
  transition:transform .2s ease, border-color .2s ease;
}
@media (hover:hover){ .card.lift:hover{transform:translateY(-3px);border-color:var(--line-strong)} }

/* ---------- Intro ---------- */
.intro h1{font-size:clamp(40px, 9vw, 72px);font-weight:800;letter-spacing:-.035em;line-height:.98;margin:20px 0 22px}
.intro h1 em{font-style:normal;color:var(--brand)}
.lead{font-size:clamp(17px, 2.4vw, 19px);color:var(--ink-2);max-width:58ch}
.lead strong{color:var(--ink);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px 24px;margin:28px 0 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta li{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:baseline;gap:8px}
.meta b{font-weight:600;color:var(--ink);font-size:14px}

.section-label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:44px 0 14px}
.section-label h2{font-size:20px;letter-spacing:-.015em}
.section-label span{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.styles{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:12px}
.style-card{display:flex;gap:16px;align-items:center;padding:18px;border-top:3px solid var(--sc)}
.style-card .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--sc);font-weight:600}
.style-card h3{font-size:19px;letter-spacing:-.015em;margin-top:2px}
.style-card p{font-size:14px;color:var(--muted);line-height:1.45;margin-top:4px}

.start{margin-top:44px}
.start label{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px;font-weight:500}
.start-row{display:flex;gap:12px}
.input{
  flex:1;min-width:0;min-height:52px;padding:0 16px;border-radius:var(--r);
  border:1px solid var(--line-strong);background:var(--bg);font-size:17px;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.input::placeholder{color:var(--muted)}
.input:hover{border-color:var(--ink-2)}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.input[aria-invalid="true"]{border-color:var(--brand)}
.field-error{margin-top:10px;font-size:14px;color:var(--brand)}
.field-error:empty{display:none}
.start-note{margin-top:14px;font-size:13px;color:var(--muted)}

/* ---------- Test ---------- */
.test-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);letter-spacing:.02em}
.counter b{color:var(--ink);font-weight:600}
.stage{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);background:var(--brand-tint);padding:6px 10px;border-radius:999px;white-space:nowrap}
.ticks{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:4px}
.ticks span{height:5px;border-radius:2px;background:var(--line);transition:background-color .2s ease}
.ticks span.done{background:color-mix(in srgb, var(--brand) 45%, var(--line))}
.ticks span.now{background:var(--brand)}
.question{margin:40px 0 28px}
.question h1{font-size:clamp(26px, 5vw, 36px);font-weight:700;letter-spacing:-.025em;line-height:1.15;max-width:24ch}
.q-anim{animation:qin .28s ease both}
@keyframes qin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.options{display:grid;gap:10px}
.option{
  display:grid;grid-template-columns:36px 1fr;align-items:center;gap:16px;
  width:100%;text-align:left;cursor:pointer;padding:16px 18px;min-height:68px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  font-size:16.5px;line-height:1.45;color:var(--ink);
  transition:border-color .15s ease, background-color .15s ease, transform .1s ease;
}
.option:hover{border-color:var(--line-strong);background:var(--surface-2)}
.option:active{transform:scale(.995)}
.option .key{
  width:36px;height:36px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--ink-2);
  background:var(--surface-3);border:1px solid var(--line-strong);
  transition:background-color .15s ease, color .15s ease, border-color .15s ease;
}
.option:hover .key{color:var(--ink)}
.option[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint)}
.option[aria-pressed="true"] .key{background:var(--brand-deep);border-color:var(--brand-deep);color:var(--brand-ink)}
.other-wrap{margin-top:2px}
.option-other{border-style:dashed;border-color:var(--line-strong);background:transparent;color:var(--ink-2)}
.option-other .key{background:transparent;border-style:dashed}
.option-other small{display:block;font-size:13.5px;color:var(--muted);margin-top:1px}
.option-other[aria-expanded="true"]{border-style:solid;border-bottom-left-radius:0;border-bottom-right-radius:0;background:var(--surface);color:var(--ink)}
.option-other[aria-pressed="true"]{border-style:solid}
.other-panel{display:none;border:1px solid var(--line-strong);border-top:none;border-radius:0 0 var(--r) var(--r);background:var(--surface);padding:0 18px 18px}
.other-panel.open{display:block}
.option-other[aria-pressed="true"] + .other-panel{border-color:var(--brand)}
.other-panel label{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);padding-top:14px;border-top:1px dashed var(--line-strong);margin-bottom:8px}
.other-panel textarea{width:100%;min-height:96px;padding:12px 14px;border-radius:var(--r-sm);resize:vertical;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
.other-panel textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.other-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.other-row .count{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.other-row .btn{min-height:44px;padding:0 18px;font-size:15px}
.other-help{font-size:13.5px;color:var(--muted);margin-top:8px}
.test-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}
.hint{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.hint kbd{font-family:inherit;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}
@media (hover:none){.hint{display:none}}

/* ---------- Result ---------- */
.print-head,.print-only{display:none}
.sec{margin-top:44px}
.sec-head{margin-bottom:16px}
.kicker{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sec-head h2{font-size:24px;letter-spacing:-.02em}
.sec-head p{color:var(--muted);font-size:15px;margin-top:6px;max-width:60ch}

.hero{
  margin-top:20px;padding:28px;border-radius:22px;border:1px solid var(--line);
  background:
    radial-gradient(120% 120% at 0% 0%, color-mix(in srgb, var(--pc) 24%, transparent) 0%, transparent 55%),
    var(--surface);
  box-shadow:var(--shadow);
}
.hero-top{display:flex;gap:26px;align-items:center}
.hero-av{position:relative;flex:none}
.hero-av svg{width:148px;height:148px}
.hero-letter{
  position:absolute;right:-6px;bottom:-6px;width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;background:var(--pc);color:#0a0a0a;
  font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;border:4px solid var(--surface);
}
.hero-who{font-family:var(--f-mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.hero h1{font-size:clamp(38px, 7.5vw, 58px);font-weight:800;letter-spacing:-.035em;line-height:.98;margin-top:8px}
.hero-tag{font-family:var(--f-mono);font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--pc);margin-top:10px}
.hero-sub{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.03em;padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-strong);color:var(--ink)}
.pill svg{width:24px;height:24px}
.hero-desc{font-size:clamp(17px, 2.5vw, 20px);line-height:1.5;color:var(--ink);margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}

.stats{display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:12px}
.stat{padding:16px;border-radius:var(--r-lg);position:relative;overflow:hidden}
.stat.is-top{border-color:color-mix(in srgb, var(--bc) 55%, var(--line));background:linear-gradient(180deg, color-mix(in srgb, var(--bc) 12%, var(--surface)), var(--surface) 70%)}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat-top svg{width:44px;height:44px}
.stat-letter{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;color:var(--bc)}
.stat-name{font-size:14px;color:var(--ink-2);margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;min-height:22px}
.stat-num{display:flex;align-items:baseline;gap:4px;margin-top:2px}
.stat-num b{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.03em}
.stat-num span{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.stat-bar{height:6px;border-radius:999px;background:var(--surface-3);margin-top:12px;overflow:hidden}
.stat-bar i{display:block;height:100%;border-radius:999px;background:var(--bc);animation:grow .9s cubic-bezier(.2,.7,.2,1) both .2s}
@keyframes grow{from{width:0}}
.stat-flag{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:var(--bc);color:#0a0a0a}
.stat-flag.soft{background:var(--surface-3);color:var(--ink-2)}
.stat-other{margin-top:12px;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.stat-other b{color:var(--ink);font-family:var(--f-mono)}
.r-warn{margin-top:14px;padding:12px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb, var(--i) 40%, var(--line));background:color-mix(in srgb, var(--i) 9%, transparent);font-size:14.5px;color:var(--ink)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{padding:0;overflow:hidden}
.col-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.col-head .sym{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:16px}
.col.plus .col-head{background:color-mix(in srgb, var(--s) 10%, transparent)}
.col.plus .sym{background:var(--s);color:#0a0a0a}
.col.minus .col-head{background:var(--brand-tint)}
.col.minus .sym{background:var(--brand-deep);color:#fff}
.col-head h3{font-size:17px;letter-spacing:-.01em}
.col ul{padding:6px 20px 14px}
.col li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.45;color:var(--ink-2)}
.col li:first-child{border-top:none}
.col li::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;margin-top:.55em}
.col.plus li::before{background:var(--s)}
.col.minus li::before{background:var(--brand)}

.train{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:12px}
.train li{padding:20px;display:flex;flex-direction:column;gap:12px}
.train .num{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;color:var(--brand);letter-spacing:-.03em}
.train p{font-size:15.5px;line-height:1.45;color:var(--ink)}

.second{display:flex;gap:20px;align-items:flex-start;border-left:3px solid var(--sc2)}
.second svg{width:80px;height:80px}
.second .tag{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sc2)}
.second h3{font-size:21px;letter-spacing:-.015em;margin-top:4px}
.second p{color:var(--ink-2);font-size:15.5px;margin-top:8px}
.second .note{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);font-size:14.5px;color:var(--ink);display:flex;gap:10px}
.second .note::before{content:"→";font-family:var(--f-mono);color:var(--brand)}

.clients{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:12px}
.client{display:flex;flex-direction:column;gap:14px;border-top:3px solid var(--cc)}
.client-head{display:flex;gap:14px;align-items:center}
.client-head svg{width:64px;height:64px}
.client-tag{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--cc)}
.client-head h3{font-size:20px;letter-spacing:-.015em;margin-top:3px}
.client .flag{display:inline-block;margin-top:6px;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.flag-clash{background:var(--brand-deep);color:#fff}
.flag-you{background:var(--surface-3);color:var(--ink-2);border:1px solid var(--line-strong)}
.client dl{display:grid;gap:10px}
.client dl > div{padding:12px 14px;border-radius:var(--r);background:var(--surface-2)}
.client dt{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.client dd{font-size:15px;line-height:1.45;color:var(--ink)}
.client dl > div.how{background:color-mix(in srgb, var(--cc) 11%, var(--surface-2))}
.client dl > div.how dt{color:var(--cc)}
.client.is-clash{box-shadow:0 0 0 1px color-mix(in srgb, var(--brand) 35%, transparent), var(--shadow)}
.clients.single{grid-template-columns:1fr}

.own{display:grid;gap:10px}
.own li{border-left:3px solid var(--brand)}
.own-meta{display:flex;gap:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.own-meta span:first-child{color:var(--brand);font-weight:600}
.own-q{margin-top:6px;font-size:14.5px;color:var(--ink-2)}
.own-a{margin-top:8px;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.35;letter-spacing:-.01em;color:var(--ink)}
.own-a::before{content:"«"}
.own-a::after{content:"»"}

.quote{margin:44px 0 0;padding:32px;border-radius:22px;background:var(--brand-deep);color:#fff;position:relative;overflow:hidden}
.quote::after{content:"”";position:absolute;right:18px;top:-30px;font-family:var(--f-display);font-weight:800;font-size:220px;line-height:1;color:rgba(255,255,255,.12)}
.quote p{font-family:var(--f-display);font-weight:700;font-size:clamp(26px, 5vw, 38px);line-height:1.12;letter-spacing:-.025em;max-width:22ch;position:relative}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

    var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;

  return arr;
});

function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return freshState();
    var s = JSON.parse(raw);
    if (!s || !Array.isArray(s.answers) || s.answers.length !== TOTAL) return freshState();
    s.others = Array.isArray(s.others) && s.others.length === TOTAL ? s.others.map(function(t){ return String(t || "").slice(0, OTHER_MAX); }) : new Array(TOTAL).fill("");
    s.answers = s.answers.map(function(a, i){
      if (a === "O") return s.others[i].trim() ? "O" : null;
      return ORDER.indexOf(a) > -1 ? a : null;
    });
    s.index = Math.max(0, Math.min(TOTAL - 1, parseInt(s.index, 10) || 0));

    if (s.screen !== "intro" && !s.name) s.screen = "intro";
    s.name = String(s.name || "").slice(0, 60);
    return s;
  }catch(e){ return freshState(); }
}

/* ================= Pantalla 1: Intro ================= */

      '<p>' + s.trait + '</p></div>' +
    '</li>';
  }).join("");

  var answered = state.answers.filter(Boolean).length;

  app.innerHTML =
  '<section class="screen intro" aria-labelledby="intro-title">' +
    '<span class="eyebrow">1% · Método NEO · Nivel inicial</span>' +
    '<h1 id="intro-title" tabindex="-1" data-focus>¿Qué tipo de <em>closer</em> vas a ser?</h1>' +
    '<p class="lead"><strong>No necesitas experiencia en ventas.</strong> Vas a leer 24 situaciones de la vida diaria, del trabajo y de cómo te imaginas vendiendo. En cada una elige lo que harías de forma natural, no lo que crees que es correcto. No hay respuestas buenas ni malas: el objetivo es descubrir tu estilo natural para entrenarte desde el primer día. Si ninguna opción se parece a lo que harías, elige <strong>«Otro»</strong> y escríbelo con tus palabras.</p>' +
    '<ul class="meta" aria-label="Detalles del test">' +
      '<li><b>24</b> situaciones</li>' +
      '<li><b>≈6</b> minutos</li>' +
      '<li><b>4</b> estilos posibles</li>' +
    '</ul>' +

    '<div class="section-label"><h2>Los cuatro estilos DISC</h2><span>Hay closers top en los cuatro</span></div>' +
    '<ul class="styles">' + cards + '</ul>' +

    '<form class="card start" id="start-form" novalidate>' +
      '<label for="name">Tu nombre</label>' +
      '<div class="start-row">' +
        '<input class="input" id="name" name="name" type="text" autocomplete="given-name" maxlength="60" placeholder="Escribe tu nombre" value="' + esc(state.name) + '" aria-describedby="name-error">' +
        '<button class="btn btn-primary" type="submit">' + (answered ? 'Continuar el test' : 'Empezar el test') + ' <span class="arrow" aria-hidden="true">→</span></button>' +
      '</div>' +
      '<p class="field-error" id="name-error" role="alert"></p>' +
      '<p class="start-note">' + (answered ? 'Llevas ' + answered + ' de 24 respuestas guardadas en este dispositivo.' : 'Tu progreso se guarda en este dispositivo por si se te cierra la página.') + '</p>' +
    '</form>' +
  '</section>';

  var form = document.getElementById("start-form");
  var input = document.getElementById("name");
  var err = document.getElementById("name-error");
  input.addEventListener("input", function(){
    if (input.value.trim()){ err.textContent = ""; input.removeAttribute("aria-invalid"); }
  });
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var v = input.value.trim().replace(/\s+/g, " ");
    if (!v){
      err.textContent = "Escribe tu nombre para personalizar tu resultado.";
      input.setAttribute("aria-invalid", "true");
      input.focus();
      return;
    }
    state.name = v;
    state.screen = "test";
    var firstEmpty = state.answers.indexOf(null);
    state.index = firstEmpty === -1 ? TOTAL - 1 : firstEmpty;
    save();
    render(true);
  });
}

/* ================= Pantalla 2: Test ================= */
var LETTERS = ["A","B","C","D"];

function renderTest(animate){
  var i = state.index;
  var q = QUESTIONS[i];
  var order = OPTION_ORDER[i];
  var answered = state.answers.filter(Boolean).length;
  var pct = Math.round(answered / TOTAL * 100);

  var ticks = "";
  for (var t = 0; t < TOTAL; t++){
    ticks += '<span class="' + (t === i ? "now" : (state.answers[t] ? "done" : "")) + '"></span>';
  }

  var opts = order.map(function(style, idx){
    var pressed = state.answers[i] === style;
    return '<button type="button" class="option" data-style="' + style + '" aria-pressed="' + pressed + '">' +
      '<span class="key" aria-hidden="true">' + LETTERS[idx] + '</span>' +
      '<span><span class="sr-only">Opción ' + LETTERS[idx] + ': </span>' + esc(q.opts[style]) + '</span>' +
    '</button>';
  }).join("");

  var isOther = state.answers[i] === "O";
  var otherText = state.others[i] || "";
  var other =
    '<div class="other-wrap">' +
      '<button type="button" class="option option-other" id="other-btn" aria-pressed="' + isOther + '" aria-expanded="' + isOther + '" aria-controls="other-panel">' +
        '<span class="key" aria-hidden="true">E</span>' +
        '<span><span class="sr-only">Opción E: </span>Otro<small>Yo haría algo diferente. Lo escribo.</small></span>' +
      '</button>' +
      '<div class="other-panel' + (isOther ? " open" : "") + '" id="other-panel">' +
        '<label for="other-text">¿Qué harías tú en esta situación?</label>' +
        '<textarea id="other-text" maxlength="' + OTHER_MAX + '" placeholder="Escribe lo que harías de forma natural…">' + esc(otherText) + '</textarea>' +
        '<div class="other-row">' +
          '<span class="count" id="other-count">' + otherText.length + '/' + OTHER_MAX + '</span>' +
          '<button type="button" class="btn btn-primary" id="other-save"' + (otherText.trim().length < 3 ? " disabled" : "") + '>Guardar y seguir <span class="arrow" aria-hidden="true">→</span></button>' +
        '</div>' +
        '<p class="other-help">Esta respuesta no suma a ningún estilo, pero aparece en tu resultado para que la revises con tu líder.</p>' +
      '</div>' +
    '</div>';

  var isFirstRender = !app.querySelector(".test");
  if (isFirstRender){
    app.innerHTML =
    '<section class="screen test" aria-labelledby="q-title">' +
      '<div class="test-head">' +
        '<p class="counter" id="counter"></p>' +
        '<span class="stage" id="stage"></span>' +
      '</div>' +
      '<div class="ticks" role="progressbar" aria-label="Progreso del test" aria-valuemin="0" aria-valuemax="100" id="progress"></div>' +
      '<div id="q-body"></div>' +
      '<div class="test-foot">' +
        '<button type="button" class="btn btn-text" id="prev"><span class="arrow arrow-left" aria-hidden="true">←</span> Anterior</button>' +
        '<span class="hint">Atajo: teclas <kbd>A</kbd>–<kbd>E</kbd></span>' +
      '</div>' +
    '</section>';
    document.getElementById("prev").addEventListener("click", goPrev);
  }

  document.getElementById("counter").innerHTML = 'Situación <b>' + String(i + 1).padStart(2, "0") + '</b> de ' + TOTAL;
  document.getElementById("stage").textContent = q.stage;
  var prog = document.getElementById("progress");
  prog.setAttribute("aria-valuenow", pct);
  prog.setAttribute("aria-valuetext", answered + " de " + TOTAL + " respondidas");
  prog.innerHTML = ticks;

  var body = document.getElementById("q-body");
  body.innerHTML =
    '<div class="' + (animate ? "q-anim" : "") + '">' +
      '<div class="question"><h1 id="q-title" tabindex="-1" data-focus>' + esc(q.text) + '</h1></div>' +
      '<div class="options" role="group" aria-labelledby="q-title">' + opts + other + '</div>' +
    '</div>';

  Array.prototype.forEach.call(body.querySelectorAll(".option[data-style]"), function(btn){
    btn.addEventListener("click", function(){ choose(btn.getAttribute("data-style"), btn); });
  });

  var oBtn = document.getElementById("other-btn");
  var oPanel = document.getElementById("other-panel");
  var oText = document.getElementById("other-text");
  var oSave = document.getElementById("other-save");
  var oCount = document.getElementById("other-count");
  oBtn.addEventListener("click", function(){
    var open = !oPanel.classList.contains("open");
    oPanel.classList.toggle("open", open);
    oBtn.setAttribute("aria-expanded", String(open));
    if (open) oText.focus();
  });
  oText.addEventListener("input", function(){
    oCount.textContent = oText.value.length + "/" + OTHER_MAX;
    oSave.disabled = oText.value.trim().length < 3;
    state.others[i] = oText.value;
    save();
  });
  oText.addEventListener("keydown", function(e){
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !oSave.disabled){ e.preventDefault(); oSave.click(); }
  });
  oSave.addEventListener("click", function(){
    var v = oText.value.trim().replace(/\s+/g, " ");
    if (v.length < 3) return;
    state.others[i] = v;
    choose("O", oBtn, 120);
  });
}

function choose(style, btn, delay){
  if (locked) return;
  locked = true;
  state.answers[state.index] = style;
  if (style !== "O") state.others[state.index] = "";
  save();
  Array.prototype.forEach.call(app.querySelectorAll(".option"), function(b){
    b.setAttribute("aria-pressed", b === btn ? "true" : "false");
  });
  var tick = document.querySelectorAll("#progress span")[state.index];
  if (tick) tick.className = "done";

  setTimeout(function(){
    locked = false;
    if (state.index < TOTAL - 1){
      state.index++;
      save();
      renderTest(true);
      focusHeading();
    } else {
      var missing = state.answers.indexOf(null);
      if (missing > -1){
        state.index = missing; save(); renderTest(true); focusHeading();
      } else {
        state.screen = "result"; save(); render(true);
      }
    }
  }, delay || 220);
}

function goPrev(){
  if (locked) return;
  if (state.index === 0){
    state.screen = "intro"; save(); render(true); return;
  }
  state.index--;
  save();
  renderTest(true);
  focusHeading();
}

document.addEventListener("keydown", function(e){
  if (state.screen !== "test" || e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  var k = e.key.toUpperCase();
  if (k === "E" || e.key === "5"){
    var ob = document.getElementById("other-btn");
    if (ob){ e.preventDefault(); if (ob.getAttribute("aria-expanded") !== "true") ob.click(); else document.getElementById("other-text").focus(); }
    return;
  }
  var idx = LETTERS.indexOf(k);
  if (idx < 0 && /^[1-4]$/.test(e.key)) idx = parseInt(e.key, 10) - 1;
  if (idx > -1){
    var btns = app.querySelectorAll(".option[data-style]");
    if (btns[idx]){ e.preventDefault(); btns[idx].focus(); btns[idx].click(); }
  } else if (e.key === "ArrowLeft"){
    e.preventDefault(); goPrev();
  }
});

/* ================= Pantalla 3: Resultado ================= */
function compute(){
  var counts = {D:0, I:0, S:0, C:0};
  var others = [];
  state.answers.forEach(function(a, i){
    if (a === "O") others.push({i:i, text:state.others[i]});
    else if (a) counts[a]++;
  });
  // Orden estable: en empate se respeta D, I, S, C
  var ranked = ORDER.slice().sort(function(a, b){ return counts[b] - counts[a]; });
  var p = ranked[0], s = ranked[1];
  return {counts:counts, primary:p, secondary:s, mixed:(counts[p] - counts[s]) <= 2, others:others, styled:TOTAL - others.length};
}

function resultText(r){
  var P = STYLES[r.primary], S = STYLES[r.secondary];
  return [
    "Test DISC del Closer · Nivel inicial · 1% Método NEO",
    "",
    "Nombre: " + state.name,
    "Estilo principal: " + r.primary + " · " + P.profile + " (" + P.name + ")",
    "Estilo secundario: " + r.secondary + " · " + S.profile + " (" + S.name + ")",
    r.mixed ? "Perfil mixto " + r.primary + "/" + r.secondary : null,
    "",
    "Conteo (de " + TOTAL + "):",
    "D Dominante: " + r.counts.D,
    "I Influyente: " + r.counts.I,
    "S Estable: " + r.counts.S,
    "C Concienzudo: " + r.counts.C,
    r.others.length ? "Respuestas propias (Otro): " + r.others.length : null
  ].filter(function(l){ return l !== null; }).concat(
    r.others.length ? [""].concat(["Lo que haría diferente:"], r.others.map(function(o){
      return "- Situación " + (o.i + 1) + " (" + QUESTIONS[o.i].stage + "): " + o.text;
    })) : []
  ).join("\n");
}

function clientCard(k, opts){
  var C = CLIENTS[k];
  var rows = '<div><dt>Cómo lo reconoces</dt><dd>' + C.recog + '</dd></div>';
  if (opts.why) rows += '<div><dt>Por qué chocan</dt><dd>' + opts.why + '</dd></div>';
  rows += '<div class="how"><dt>Cómo venderle</dt><dd>' + ADAPT[k] + '</dd></div>';
  return '<article class="card lift client rise' + (opts.clash ? ' is-clash' : '') + '" style="--cc:' + COLOR[k] + ';--n:' + (opts.n || 0) + '">' +
    '<div class="client-head">' + avatar(k) +
      '<div><span class="client-tag">Cliente ' + k + ' · ' + STYLES[k].name + '</span>' +
      '<h3>' + C.nick + '</h3>' + (opts.flag || '') + '</div>' +
    '</div>' +
    '<dl>' + rows + '</dl>' +
  '</article>';
}

function renderResult(){
  var r = compute();
  var P = STYLES[r.primary], PP = PROFILES[r.primary];
  var S = STYLES[r.secondary], SP = PROFILES[r.secondary];

  var subline = r.mixed
    ? '<span class="pill">' + avatar(r.secondary) + 'Perfil mixto ' + r.primary + '/' + r.secondary + '</span><span>Tu lado ' + S.profile.replace("El ", "").toLowerCase() + ' está casi a la par.</span>'
    : '<span>Estilo secundario:</span><span class="pill">' + avatar(r.secondary) + r.secondary + ' · ' + S.profile + '</span>';

  var stats = ORDER.map(function(k, n){
    var c = r.counts[k];
    var flag = k === r.primary ? '<span class="stat-flag">Tu estilo</span>' : (k === r.secondary ? '<span class="stat-flag soft">2.º estilo</span>' : '');
    return '<div class="card stat rise' + (k === r.primary ? ' is-top' : '') + '" style="--bc:' + COLOR[k] + ';--n:' + n + '">' +
      '<div class="stat-top">' + avatar(k) + '<span class="stat-letter" aria-hidden="true">' + k + '</span></div>' +
      '<p class="stat-name"><span>' + STYLES[k].name + '</span>' + flag + '</p>' +
      '<p class="stat-num"><b>' + c + '</b><span>/' + TOTAL + '</span></p>' +
      '<div class="stat-bar" aria-hidden="true"><i style="width:' + (c / TOTAL * 100).toFixed(2) + '%"></i></div>' +
    '</div>';
  }).join("");
  var otherLine = r.others.length
    ? '<p class="stat-other"><b>+' + r.others.length + '</b> respuestas propias en «Otro». No suman a ningún estilo.</p>'
    : '';
  var lowData = r.others.length >= 9
    ? '<p class="r-warn">Elegiste «Otro» en ' + r.others.length + ' situaciones, así que tu estilo se calculó con ' + r.styled + ' respuestas. Tómalo como una orientación y revísalo con tu líder.</p>'
    : '';

  function list(arr){ return arr.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join(""); }

  var train = PP.train.map(function(t, n){
    return '<li class="card lift rise" style="--n:' + n + '"><span class="num">' + String(n + 1).padStart(2, "0") + '</span><p>' + esc(t) + '</p></li>';
  }).join("");

  var clash = PP.clash.map(function(k, n){
    return clientCard(k, {why:CLASH_WHY[r.primary + k], clash:true, n:n});
  }).join("");

  var adapt = ORDER.map(function(k, n){
    var flag = PP.clash.indexOf(k) > -1 ? '<span class="flag flag-clash">Chocas</span>'
      : (k === r.primary ? '<span class="flag flag-you">Tu mismo estilo</span>' : '');
    return clientCard(k, {flag:flag, n:n});
  }).join("");

  var ownList = r.others.map(function(o){
    var q = QUESTIONS[o.i];
    return '<li class="card"><div class="own-meta"><span>Situación ' + String(o.i + 1).padStart(2, "0") + '</span><span>' + esc(q.stage) + '</span></div>' +
      '<p class="own-q">' + esc(q.text) + '</p>' +
      '<p class="own-a">' + esc(o.text) + '</p></li>';
  }).join("");

  var closing =
    '<blockquote class="quote"><p>' + PP.quote + '</p><cite>' + P.profile + ' · Método NEO</cite></blockquote>' +
    '<p class="final-note"><b>DISC describe cómo te comportas, no cuánto vas a vender.</b> Desde cualquiera de los cuatro estilos puedes llegar a ser un closer top. La diferencia está en conocer tu estilo natural y entrenar para moverte hacia el estilo del cliente.</p>';

  var name = esc(firstName(state.name));
  var today = new Date().toLocaleDateString("es-CO", {day:"numeric", month:"long", year:"numeric"});

  app.innerHTML =
  '<section class="screen result" style="--pc:' + COLOR[r.primary] + '" aria-labelledby="r-title">' +

    '<div class="pg">' +
      '<header class="print-head" aria-hidden="true">' +
        '<div><div class="print-brand"><span class="brand-mark">1%</span><span class="brand-sep"></span><span class="brand-name">Método NEO · Test DISC · Nivel inicial</span></div>' +
        '<p class="print-name">' + esc(state.name) + '</p></div>' +
        '<p class="print-date">Resultado del<br>' + today + '</p>' +
      '</header>' +
      '<span class="eyebrow">Tu resultado · Test DISC · Nivel inicial</span>' +

      '<div class="hero">' +
        '<div class="hero-top">' +
          '<div class="hero-av">' + avatar(r.primary) + '<span class="hero-letter" aria-hidden="true">' + r.primary + '</span></div>' +
          '<div>' +
            '<p class="hero-who">' + name + ', tu estilo natural</p>' +
            '<h1 id="r-title" tabindex="-1" data-focus>' + P.profile + '</h1>' +
            '<p class="hero-tag">' + r.primary + ' · ' + P.name + '</p>' +
            '<p class="hero-sub">' + subline + '</p>' +
          '</div>' +
        '</div>' +
        '<p class="hero-desc">' + PP.desc + '</p>' +
      '</div>' +

      '<section class="sec" aria-labelledby="h-stats">' +
        '<div class="sec-head"><span class="kicker">Tus respuestas</span><h2 id="h-stats">Cómo se reparte tu estilo</h2></div>' +
        '<div class="stats">' + stats + '</div>' +
        otherLine + lowData +
      '</section>' +
    '</div>' +

    '<div class="pg">' +
      '<section class="sec" aria-label="Fortalezas y riesgos">' +
        '<div class="sec-head"><span class="kicker">Para vender</span><h2>Tus talentos y tus retos</h2></div>' +
        '<div class="cols">' +
          '<div class="card col plus"><div class="col-head"><span class="sym" aria-hidden="true">+</span><h3>Tu talento natural para vender</h3></div><ul>' + list(PP.shine) + '</ul></div>' +
          '<div class="card col minus"><div class="col-head"><span class="sym" aria-hidden="true">!</span><h3>Lo que te puede costar al empezar</h3></div><ul>' + list(PP.fall) + '</ul></div>' +
        '</div>' +
      '</section>' +

      '<section class="sec" aria-labelledby="h-train">' +
        '<div class="sec-head"><span class="kicker">Tu plan</span><h2 id="h-train">Tus primeros pasos en el entrenamiento</h2></div>' +
        '<ol class="train">' + train + '</ol>' +
      '</section>' +

      '<section class="sec" aria-labelledby="h-second">' +
        '<div class="sec-head"><span class="kicker">Tu recurso</span><h2 id="h-second">Tu estilo secundario</h2></div>' +
        '<div class="card second" style="--sc2:' + COLOR[r.secondary] + '">' + avatar(r.secondary) +
          '<div>' +
            '<span class="tag">' + r.secondary + ' · ' + S.name + ' · ' + r.counts[r.secondary] + '/' + TOTAL + '</span>' +
            '<h3>' + S.profile + '</h3>' +
            '<p>' + SP.desc + '</p>' +
            '<p class="note">Úsalo como recurso cuando tu estilo natural no conecte con un cliente.</p>' +
          '</div>' +
        '</div>' +
      '</section>' +
    '</div>' +

    '<div class="pg">' +
      '<section class="sec" aria-labelledby="h-clash">' +
        '<div class="sec-head"><span class="kicker">Atención</span><h2 id="h-clash">Con quién vas a chocar</h2>' +
        '<p>Cuando empieces a vender, estos son los clientes con los que tu estilo natural va a generar más fricción. No es que no les vayas a vender: es que te va a tocar moverte hacia ellos.</p></div>' +
        '<div class="clients' + (PP.clash.length === 1 ? ' single' : '') + '">' + clash + '</div>' +
      '</section>' +
      '<div class="print-only">' + closing + '</div>' +
    '</div>' +

    '<div class="pg">' +
      '<section class="sec" aria-labelledby="h-adapt">' +
        '<div class="sec-head"><span class="kicker">Guía rápida</span><h2 id="h-adapt">Cómo adaptarte a cada cliente</h2>' +
        '<p>Los mismos cuatro estilos existen en los clientes. Cuando empieces a hacer llamadas, identifica cuál tienes al frente y ajusta tu forma de vender.</p></div>' +
        '<div class="clients">' + adapt + '</div>' +
      '</section>' +
    '</div>' +

    '<div class="pg' + (r.others.length ? '' : ' print-hide') + '">' +
      (r.others.length ?
      '<section class="sec" aria-labelledby="h-own">' +
        '<div class="sec-head"><span class="kicker">Con tus palabras</span><h2 id="h-own">Lo que harías diferente</h2>' +
        '<p>En estas situaciones ninguna opción te representó. Llévalas a tu sesión de entrenamiento: dicen mucho de tu estilo real.</p></div>' +
        '<ol class="own">' + ownList + '</ol>' +
      '</section>' : '') +

      '<div class="screen-only">' + closing + '</div>' +
    '</div>' +

    '<div class="actions">' +
      '<button type="button" class="btn btn-primary" id="pdf">Descargar PDF <span class="arrow" aria-hidden="true">↓</span></button>' +
      '<button type="button" class="btn btn-ghost" id="copy">Copiar mi resultado</button>' +
      '<button type="button" class="btn btn-text" id="restart">Repetir el test</button>' +
    '</div>' +
    '<p class="pdf-help">Se abre la ventana de impresión: en <b>Destino</b> elige <b>Guardar como PDF</b>.</p>' +
    '<p class="copy-status" id="copy-status" role="status"></p>' +
    '<div class="copy-fallback" id="copy-fallback">' +
      '<label for="copy-text">No pudimos copiar automáticamente. El texto ya está seleccionado: cópialo con Ctrl+C o Cmd+C.</label>' +
      '<textarea id="copy-text" readonly></textarea>' +
    '</div>' +
  '</section>';

  var text = resultText(r);
  document.getElementById("copy").addEventListener("click", function(){
    var status = document.getElementById("copy-status");
    function fallback(){
      var box = document.getElementById("copy-fallback");
      var ta = document.getElementById("copy-text");
      ta.value = text;
      box.classList.add("show");
      status.textContent = "";
      ta.focus(); ta.select();
    }
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){
        status.textContent = "Resultado copiado. Pégalo donde te lo pida tu líder.";
      }, fallback);
    } else {
      fallback();
    }
  });

  document.getElementById("pdf").addEventListener("click", function(){
    var prevTitle = document.title;
    var safe = state.name.replace(/[\\/:*?"<>|]+/g, "").trim();
    document.title = "Resultado DISC Nivel inicial - " + safe;
    var restore = function(){ document.title = prevTitle; window.removeEventListener("afterprint", restore); };
    window.addEventListener("afterprint", restore);
    window.print();
  });

  document.getElementById("restart").addEventListener("click", function(){
    var keepName = state.name;
    clearStore();
    state = freshState();
    state.name = keepName;
    save();
    render(true);
  });
}

/* ================= Router ================= */
function render(moveFocus){
  if (state.screen !== "test") app.innerHTML = "";
  if (state.screen === "intro") renderIntro();
  else if (state.screen === "test") renderTest(false);
  else renderResult();
  if (moveFocus){ scrollTop(); focusHeading(); }
}

render(false);
})();
</script>
</body>
</html>
