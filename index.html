<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test DISC del Closer · Nivel inicial · 1% Método NEO</title>
<meta name="description" content="Test DISC para quienes van a empezar en ventas: descubre qué tipo de closer vas a ser con el Método NEO.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta */
  --black:#000000;
  --surface:#121212;
  --surface-2:#1b1b1b;
  --surface-3:#262626;
  --bone:#f3efe9;
  --bone-2:#cfc9bf;
  --ash:#a39d93;
  --line:#262422;
  --line-strong:#3b3835;
  --red:#ff4a3f;
  --red-deep:#d3241c;
  --red-hover:#e9332a;
  --d:#ff4a3f;
  --i:#f0b42c;
  --s:#3fc58b;
  --c:#6e9dff;

  --font:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* Radios por jerarquía */
  --r-pill:999px;
  --r-panel:22px;
  --r-card:16px;
  --r-inner:10px;

  --ease-out:cubic-bezier(.2,.8,.2,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--black)}
body{
  margin:0;min-height:100dvh;background:var(--black);color:var(--bone);
  font-family:var(--font);font-size:16px;line-height:1.55;font-stretch:100%;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
}
h1,h2,h3,p{margin:0}
ul,ol,dl,dd{margin:0;padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.av{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- Estructura ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.topbar{border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ash);white-space:nowrap}
.brand-mark{font-weight:900;font-stretch:125%;font-size:22px;letter-spacing:-.04em;color:var(--red);line-height:1}
.brand-sep{width:1px;height:18px;background:var(--line-strong)}
.brand-name{color:var(--bone-2);font-weight:600}
.brand-by b{color:var(--bone);font-weight:700}
.topbar-right{font-size:13px;color:var(--ash)}
#app{padding-top:44px;padding-bottom:88px}
.screen{animation:enter .4s var(--ease-out) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Tipografía ---------- */
.kicker{font-size:14px;font-weight:600;color:var(--red)}
.display{font-weight:850;font-stretch:125%;letter-spacing:-.025em;line-height:.95;text-wrap:balance}
.h2{font-size:26px;font-weight:800;font-stretch:112%;letter-spacing:-.015em;line-height:1.1}
.help{color:var(--ash);font-size:15.5px;margin-top:8px;max-width:62ch}
.sec{margin-top:56px}
.sec-head{margin-bottom:20px}

/* ---------- Botones ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:54px;padding:0 28px;border-radius:var(--r-pill);border:1px solid transparent;
  font-weight:700;font-size:16px;font-stretch:105%;
  transition:background-color .15s ease, border-color .15s ease, transform .12s ease, opacity .15s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--red-deep);color:#fff}
.btn-primary:hover{background:var(--red-hover)}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--bone)}
.btn-ghost:hover{border-color:var(--bone-2)}
.btn-text{background:none;border:none;min-height:44px;padding:0 6px;color:var(--ash);font-weight:600}
.btn-text:hover{color:var(--bone)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}

/* ---------- Mapa DISC ---------- */
.map{display:grid;grid-template-columns:22px 1fr 22px;grid-template-rows:auto 1fr auto;gap:10px;position:relative}
.axis{font-size:13px;font-weight:600;color:var(--ash);display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.axis-top{grid-column:2;grid-row:1}
.axis-bottom{grid-column:2;grid-row:3}
.axis-left,.axis-right{grid-row:2;writing-mode:vertical-rl}
.axis-left{grid-column:1;transform:rotate(180deg)}
.axis-right{grid-column:3}
.axis::before,.axis::after{content:"";flex:1;max-width:36px;height:1px;background:var(--line-strong)}
.axis-left::before,.axis-left::after,.axis-right::before,.axis-right::after{width:1px;height:auto;max-height:36px;max-width:none}
.map-grid{
  grid-column:2;grid-row:2;position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:3px;border-radius:var(--r-panel);overflow:hidden;background:var(--line-strong);
}
.quad{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px;min-height:220px;background:var(--qbg)}
.quad svg.av{width:58px;height:58px;margin-bottom:6px}
.quad .q-letter{font-weight:700;font-size:13.5px;color:var(--qc)}
.quad .q-name{font-size:19px;font-weight:800;font-stretch:110%;letter-spacing:-.01em;line-height:1.1}
.quad .q-trait{font-size:14px;color:var(--bone-2);line-height:1.4;margin-top:2px}
.quad .q-count{font-size:14px;color:var(--bone-2);margin-top:2px}
.quad .q-count b{font-size:30px;font-weight:900;font-stretch:120%;color:var(--bone);line-height:1;margin-right:4px}
.q-tr,.q-br{align-items:flex-end;text-align:right}
.q-bl,.q-br{justify-content:flex-end}
.quad.is-top{box-shadow:inset 0 0 0 2px var(--qc)}
.you{
  position:absolute;left:50%;top:50%;z-index:2;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;background:var(--bone);color:#000;font-weight:900;font-size:14px;font-stretch:110%;
  border:4px solid var(--red-deep);box-shadow:0 0 0 6px rgba(0,0,0,.55);
  transform:translate(-50%,-50%) scale(.3);opacity:0;
  transition:left 1s var(--ease-out), top 1s var(--ease-out), transform .6s var(--ease-out), opacity .3s ease;
}
.map.placed .you{left:var(--x);top:var(--y);transform:translate(-50%,-50%);opacity:1}
.map-caption{margin-top:14px;color:var(--ash);font-size:14.5px;max-width:62ch}
.map-caption b{color:var(--bone);font-weight:700}

/* ---------- Intro ---------- */
.intro .display{font-size:clamp(46px, 11.5vw, 92px);margin:14px 0 22px}
.lead{font-size:clamp(17px, 2.4vw, 19.5px);color:var(--bone-2);max-width:56ch}
.facts{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:12px;margin-top:32px}
.fact{padding:16px 18px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line)}
.fact b{display:block;font-weight:900;font-stretch:125%;font-size:30px;line-height:1;color:var(--bone)}
.fact span{display:block;font-size:14px;color:var(--ash);margin-top:6px;line-height:1.3}
.intro-map{margin-top:48px}
.start{margin-top:40px;padding:24px;border-radius:var(--r-panel);background:var(--surface);border:1px solid var(--line)}
.start label{display:block;font-size:15px;font-weight:700;margin-bottom:10px}
.start-row{display:flex;gap:12px}
.input{
  flex:1;min-width:0;min-height:54px;padding:0 18px;border-radius:var(--r-pill);
  border:1px solid var(--line-strong);background:var(--black);font-size:17px;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.input::placeholder{color:#7d786f}
.input:hover{border-color:var(--bone-2)}
.input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px rgba(255,74,63,.18)}
.input[aria-invalid="true"]{border-color:var(--red)}
.field-error{margin-top:10px;font-size:14.5px;color:var(--red)}
.field-error:empty{display:none}
.start-note{margin-top:12px;font-size:14px;color:var(--ash)}

/* ---------- Test ---------- */
.test-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.counter{font-size:15px;color:var(--ash)}
.counter b{color:var(--bone);font-weight:800}
.stage{font-size:13px;font-weight:700;color:var(--red);background:rgba(255,74,63,.12);padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap}
.ticks{display:grid;grid-template-columns:repeat(24,1fr);gap:3px}
.ticks span{height:6px;border-radius:3px;background:var(--surface-3);transition:background-color .25s ease}
.ticks span.done{background:#7a2420}
.ticks span.now{background:var(--red)}
.question{margin:40px 0 28px}
.question h1{font-size:clamp(27px, 5.4vw, 38px);font-weight:780;font-stretch:108%;letter-spacing:-.02em;line-height:1.15;max-width:24ch;text-wrap:balance}
.q-anim{animation:qin .3s var(--ease-out) both}
@keyframes qin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.options{display:grid;gap:10px}
.option{
  display:grid;grid-template-columns:38px 1fr;align-items:center;gap:16px;width:100%;text-align:left;
  padding:16px 18px;min-height:70px;border-radius:var(--r-card);
  background:var(--surface);border:1px solid var(--line);font-size:16.5px;line-height:1.45;color:var(--bone);
  transition:border-color .15s ease, background-color .15s ease, transform .12s ease;
}
.option:hover{border-color:var(--line-strong);background:var(--surface-2)}
.option:active{transform:scale(.99)}
.option .key{
  width:38px;height:38px;border-radius:var(--r-inner);display:grid;place-items:center;
  font-weight:800;font-stretch:115%;font-size:15px;color:var(--bone-2);background:var(--surface-3);
  transition:background-color .15s ease, color .15s ease;
}
.option[aria-pressed="true"]{border-color:var(--red);background:rgba(255,74,63,.1)}
.option[aria-pressed="true"] .key{background:var(--red-deep);color:#fff}
.other-wrap{margin-top:2px}
.option-other{border-style:dashed;border-color:var(--line-strong);background:transparent;color:var(--bone-2)}
.option-other .key{background:transparent;border:1px dashed var(--line-strong)}
.option-other small{display:block;font-size:14px;color:var(--ash);margin-top:1px}
.option-other[aria-expanded="true"]{border-style:solid;border-bottom-left-radius:0;border-bottom-right-radius:0;background:var(--surface);color:var(--bone)}
.option-other[aria-pressed="true"]{border-style:solid}
.other-panel{display:none;border:1px solid var(--line-strong);border-top:none;border-radius:0 0 var(--r-card) var(--r-card);background:var(--surface);padding:0 18px 18px}
.other-panel.open{display:block}
.option-other[aria-pressed="true"] + .other-panel{border-color:var(--red)}
.other-panel label{display:block;font-size:14px;font-weight:700;padding-top:14px;border-top:1px dashed var(--line-strong);margin-bottom:8px}
.other-panel textarea{width:100%;min-height:100px;padding:12px 14px;border-radius:var(--r-inner);resize:vertical;border:1px solid var(--line-strong);background:var(--black);color:var(--bone);font-size:16px;line-height:1.5}
.other-panel textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px rgba(255,74,63,.18)}
.other-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.other-row .count{font-size:13px;color:var(--ash)}
.other-row .btn{min-height:46px;padding:0 20px;font-size:15px}
.other-row .btn .arrow{display:none}
.other-help{font-size:14px;color:var(--ash);margin-top:8px}
.test-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}
.test-foot .arrow{display:none}
.hint{font-size:13px;color:var(--ash)}
.hint kbd{font-family:inherit;font-weight:700;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--bone-2)}
@media (hover:none){.hint{display:none}}

/* ---------- Resultado ---------- */
.print-head,.print-only{display:none}
.r-head{display:flex;align-items:flex-end;gap:24px}
.r-head-av{position:relative;flex:none}
.r-head-av svg{width:132px;height:132px}
.r-who{font-size:17px;color:var(--bone-2)}
.r-who b{color:var(--bone);font-weight:800}
.r-title{font-size:clamp(46px, 11vw, 86px);color:var(--pc);margin-top:6px}
.r-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:16px;font-size:15.5px;color:var(--bone-2)}
.r-meta .tag{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line-strong);color:var(--bone);font-weight:700}
.r-meta .tag svg{width:26px;height:26px}
.r-meta .letter{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:#000;font-weight:900;font-size:14px}
.r-desc{font-size:clamp(18px, 2.6vw, 21px);line-height:1.5;color:var(--bone);margin-top:28px;max-width:56ch}
.r-warn{margin-top:14px;padding:12px 16px;border-radius:var(--r-inner);border:1px solid rgba(240,180,44,.4);background:rgba(240,180,44,.08);font-size:15px;color:var(--bone)}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:22px 22px 10px;border-top:4px solid var(--pcol)}
.panel h3{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800;font-stretch:108%;line-height:1.2;margin-bottom:8px}
.panel h3 svg{width:28px;height:28px;flex:none;color:var(--pcol)}
.panel li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.45;color:var(--bone-2)}
.panel li:first-child{border-top:none}
.panel li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:.5em;background:var(--pcol)}
.panel.good{--pcol:var(--s)}
.panel.risk{--pcol:var(--red)}

.steps{display:grid;gap:0;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line)}
.steps .n{font-weight:900;font-stretch:125%;font-size:44px;line-height:.9;color:var(--red)}
.steps p{font-size:18px;line-height:1.45;color:var(--bone)}

.second{display:flex;gap:20px;align-items:flex-start;padding:22px;border-radius:var(--r-panel);background:var(--surface);border:1px solid var(--line)}
.second svg.av{width:84px;height:84px}
.second .s-tag{font-size:14px;font-weight:700;color:var(--sc2)}
.second h3{font-size:22px;font-weight:800;font-stretch:110%;margin-top:2px}
.second p{color:var(--bone-2);font-size:15.5px;margin-top:8px}
.second .note{margin-top:14px;padding:12px 14px;border-radius:var(--r-inner);background:var(--surface-2);color:var(--bone);font-size:15px}

.clients{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:14px}
.clients.single{grid-template-columns:1fr}
.client{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:var(--r-panel);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--cc)}
.client-head{display:flex;gap:14px;align-items:center}
.client-head svg.av{width:64px;height:64px}
.client-tag{display:block;font-size:14px;font-weight:700;color:var(--cc)}
.client-head h3{font-size:21px;font-weight:800;font-stretch:110%;margin-top:1px}
.flag{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill)}
.flag-clash{background:var(--red-deep);color:#fff}
.flag-you{background:var(--surface-3);color:var(--bone-2)}
.client dl{display:grid;gap:8px}
.client dl > div{padding:12px 14px;border-radius:var(--r-inner);background:var(--surface-2)}
.client dt{font-size:13px;font-weight:700;color:var(--ash);margin-bottom:3px}
.client dd{font-size:15px;line-height:1.45;color:var(--bone)}
.client dl > div.how{background:color-mix(in srgb, var(--cc) 13%, var(--surface-2))}
.client dl > div.how dt{color:var(--cc)}
.adapt-note{margin-top:12px;font-size:14px;color:var(--ash)}

.own{display:grid;gap:10px}
.own li{padding:18px 20px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red)}
.own-meta{display:flex;gap:10px;font-size:13.5px;color:var(--ash)}
.own-meta b{color:var(--red);font-weight:800}
.own-q{margin-top:6px;font-size:15px;color:var(--bone-2)}
.own-a{margin-top:8px;font-weight:700;font-stretch:105%;font-size:18px;line-height:1.35;color:var(--bone)}

.quote{margin:56px 0 0;padding:34px;border-radius:var(--r-panel);background:var(--red-deep);color:#fff}
.quote p{font-weight:850;font-stretch:115%;font-size:clamp(28px, 5.4vw, 42px);line-height:1.08;letter-spacing:-.02em;max-width:20ch;text-wrap:balance}
.quote cite{display:block;margin-top:18px;font-style:normal;font-size:14.5px;font-weight:600;color:rgba(255,255,255,.82)}
.final-note{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);font-size:15px;color:var(--ash);line-height:1.6;max-width:66ch}
.final-note b{color:var(--bone);font-weight:700}

.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.pdf-help{margin-top:12px;font-size:14px;color:var(--ash)}
.pdf-help.is-error{color:var(--red)}
.copy-status{margin-top:8px;font-size:14px;color:var(--s);min-height:1.4em}
.copy-fallback{display:none;margin-top:16px}
.copy-fallback.show{display:block}
.copy-fallback label{display:block;font-size:14.5px;color:var(--bone-2);margin-bottom:8px}
.copy-fallback textarea{width:100%;min-height:180px;padding:14px;border-radius:var(--r-card);border:1px solid var(--line-strong);background:var(--surface);color:var(--bone);font-size:14px;line-height:1.6;resize:vertical}

footer{border-top:1px solid var(--line);padding:24px 0 40px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ash)}

/* ---------- Móvil ---------- */
@media (max-width:640px){
  .wrap{padding:0 16px}
  #app{padding-top:30px;padding-bottom:60px}
  .topbar-right{display:none}
  .brand{gap:10px;font-size:13px}
  .facts{gap:8px}
  .fact{padding:14px 12px}
  .fact b{font-size:24px}
  .fact span{font-size:13px}
  .start{padding:18px}
  .start-row{flex-direction:column}
  .start-row .btn{width:100%}
  .map{grid-template-columns:18px 1fr 18px;gap:8px}
  .axis{font-size:12px}
  .quad{padding:12px;min-height:200px}
  .quad svg.av{width:44px;height:44px}
  .quad .q-name{font-size:16px}
  .quad .q-trait{font-size:13px}
  .quad .q-count b{font-size:24px}
  .question{margin:28px 0 22px}
  .option{padding:14px;gap:14px;grid-template-columns:34px 1fr;font-size:16px;min-height:66px}
  .option .key{width:34px;height:34px}
  .r-head{flex-direction:column;align-items:flex-start;gap:16px}
  .r-head-av svg{width:96px;height:96px}
  .duo,.clients{grid-template-columns:1fr}
  .steps li{grid-template-columns:48px 1fr}
  .steps .n{font-size:34px}
  .steps p{font-size:16.5px}
  .second{flex-direction:column;gap:14px;padding:18px}
  .second svg.av{width:64px;height:64px}
  .client{padding:18px}
  .quote{padding:24px}
  .actions .btn{flex:1 1 100%}
}

/* ---------- PDF descargable (se genera fuera de pantalla) ---------- */
.pdf-stage{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}
.pdf-page{width:794px;min-height:1123px;padding:48px 52px;background:var(--black);color:var(--bone);font-family:var(--font);font-size:13px;line-height:1.5}
.pdf-page *,.pdf-page *::before,.pdf-page *::after{animation:none !important;transition:none !important}
.pdf-page .print-only{display:block}
.pdf-page .screen-only,.pdf-page .r-kicker{display:none}
.pdf-page .pg > :first-child,.pdf-page .pg > .print-head + *{margin-top:0}

  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

  };
}

});

/* ================= Mapa DISC ================= */
var MAP_ORDER = [["D","q-tl"],["I","q-tr"],["C","q-bl"],["S","q-br"]];
function quadBg(k, pct){ return "color-mix(in srgb, " + COLOR[k] + " " + pct + "%, #0e0e0e)"; }

function discMap(opts){
  opts = opts || {};
  var counts = opts.counts, max = 1;
  if (counts) max = Math.max(1, counts.D, counts.I, counts.S, counts.C);
  var quads = MAP_ORDER.map(function(pair){
    var k = pair[0], pos = pair[1];
    var pct = counts ? Math.round(8 + 30 * (counts[k] / max)) : 14;
    var body = counts
      ? '<p class="q-count num"><b>' + counts[k] + '</b>de ' + TOTAL + '</p>'
      : '<p class="q-trait">' + STYLES[k].trait + '</p>';
    var top = counts && k === opts.primary ? " is-top" : "";
    return '<div class="quad ' + pos + top + '" style="--qc:' + COLOR[k] + ';--qbg:' + quadBg(k, pct) + '">' +
      avatar(k) +
      '<span class="q-letter">' + k + ', ' + STYLES[k].name.toLowerCase() + '</span>' +
      '<h3 class="q-name">' + STYLES[k].profile + '</h3>' + body +
    '</div>';
  }).join("");
  var you = opts.you ? '<span class="you" aria-hidden="true">Tú</span>' : '';
  var style = opts.you ? ' style="--x:' + opts.you.x + '%;--y:' + opts.you.y + '%"' : '';
  return '<div class="map' + (opts.placed ? ' placed' : '') + '"' + style + '>' +
    '<span class="axis axis-top">Rápido y directo</span>' +
    '<span class="axis axis-left">Enfocado en tareas</span>' +
    '<div class="map-grid">' + quads + you + '</div>' +
    '<span class="axis axis-right">Enfocado en personas</span>' +
    '<span class="axis axis-bottom">Pausado y reflexivo</span>' +
  '</div>';
}

function youPosition(c, styled){
  var n = Math.max(1, styled);
  var x = ((c.I + c.S) - (c.D + c.C)) / n;
  var y = ((c.D + c.I) - (c.S + c.C)) / n;
  // El punto se mueve cerca del cruce central para no tapar el texto de los cuadrantes
  var clamp = function(v){ return Math.max(35, Math.min(65, v)); };
  return {x: clamp(50 + x * 16).toFixed(1), y: clamp(50 - y * 16).toFixed(1)};
}

/* ================= Pantalla 2: Test ================= */
var LETTERS = ["A","B","C","D"];

function renderTest(animate){
  var i = state.index;
  var q = QUESTIONS[i];
  var order = OPTION_ORDER[i];
  var answered = state.answers.filter(Boolean).length;
  var pct = Math.round(answered / TOTAL * 100);

  }

      '<span class="key" aria-hidden="true">' + LETTERS[idx] + '</span>' +

  var otherText = state.others[i] || "";
  var other =

      '</button>' +

        '<label for="other-text">¿Qué harías tú en esta situación?</label>' +

        '<div class="other-row">' +
          '<span class="count" id="other-count">' + otherText.length + '/' + OTHER_MAX + '</span>' +
          '<button type="button" class="btn btn-primary" id="other-save"' + (otherText.trim().length < 3 ? " disabled" : "") + '>Guardar y seguir <span class="arrow" aria-hidden="true">→</span></button>' +
        '</div>' +
        '<p class="other-help">Esta respuesta no suma a ningún estilo, pero aparece en tu resultado para que la revises con tu líder.</p>' +
      '</div>' +
    '</div>';

  var isFirstRender = !app.querySelector(".test");
  if (isFirstRender){
    app.innerHTML =
    '<section class="screen test" aria-labelledby="q-title">' +
      '<div class="test-head">' +
        '<p class="counter" id="counter"></p>' +
        '<span class="stage" id="stage"></span>' +

      '<div class="ticks" role="progressbar" aria-label="Progreso del test" aria-valuemin="0" aria-valuemax="100" id="progress"></div>' +

        '<button type="button" class="btn btn-text" id="prev"><span class="arrow arrow-left" aria-hidden="true">←</span> Anterior</button>' +
        '<span class="hint">Atajo: teclas <kbd>A</kbd>–<kbd>E</kbd></span>' +
      '</div>' +
    '</section>';
    document.getElementById("prev").addEventListener("click", goPrev);
  }

  document.getElementById("counter").innerHTML = 'Situación <b>' + (i + 1) + '</b> de ' + TOTAL;
  document.getElementById("stage").textContent = q.stage;
  var prog = document.getElementById("progress");
  prog.setAttribute("aria-valuenow", pct);
  prog.setAttribute("aria-valuetext", answered + " de " + TOTAL + " respondidas");

    '</div>';

  Array.prototype.forEach.call(body.querySelectorAll(".option[data-style]"), function(btn){
    btn.addEventListener("click", function(){ choose(btn.getAttribute("data-style"), btn); });
  });

  var oBtn = document.getElementById("other-btn");
  var oPanel = document.getElementById("other-panel");
  var oText = document.getElementById("other-text");
  var oSave = document.getElementById("other-save");
  var oCount = document.getElementById("other-count");
  oBtn.addEventListener("click", function(){

    save();
  });

    if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !oSave.disabled){ e.preventDefault(); oSave.click(); }
  });
  oSave.addEventListener("click", function(){
    var v = oText.value.trim().replace(/\s+/g, " ");
    if (v.length < 3) return;
    state.others[i] = v;
    choose("O", oBtn, 120);
  });
}

function choose(style, btn, delay){
  if (locked) return;
  locked = true;
  state.answers[state.index] = style;
  if (style !== "O") state.others[state.index] = "";
  save();
  Array.prototype.forEach.call(app.querySelectorAll(".option"), function(b){
    b.setAttribute("aria-pressed", b === btn ? "true" : "false");
  });
  var tick = document.querySelectorAll("#progress span")[state.index];
  if (tick) tick.className = "done";

  setTimeout(function(){
    locked = false;
    if (state.index < TOTAL - 1){
      state.index++;
      save();
      renderTest(true);
      focusHeading();
    } else {
      var missing = state.answers.indexOf(null);
      if (missing > -1){
        state.index = missing; save(); renderTest(true); focusHeading();
      } else {
        state.screen = "result"; save(); render(true);
      }
    }
  }, delay || 220);
}

function goPrev(){
  if (locked) return;
  if (state.index === 0){
    state.screen = "intro"; save(); render(true); return;
  }
  state.index--;
  save();
  renderTest(true);
  focusHeading();
}

document.addEventListener("keydown", function(e){
  if (state.screen !== "test" || e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  var k = e.key.toUpperCase();
  if (k === "E" || e.key === "5"){
    var ob = document.getElementById("other-btn");
    if (ob){ e.preventDefault(); if (ob.getAttribute("aria-expanded") !== "true") ob.click(); else document.getElementById("other-text").focus(); }
    return;
  }
  var idx = LETTERS.indexOf(k);
  if (idx < 0 && /^[1-4]$/.test(e.key)) idx = parseInt(e.key, 10) - 1;
  if (idx > -1){
    var btns = app.querySelectorAll(".option[data-style]");
    if (btns[idx]){ e.preventDefault(); btns[idx].focus(); btns[idx].click(); }
  } else if (e.key === "ArrowLeft"){
    e.preventDefault(); goPrev();
  }
});

/* ================= Pantalla 3: Resultado ================= */
function compute(){
  var counts = {D:0, I:0, S:0, C:0};
  var others = [];
  state.answers.forEach(function(a, i){
    if (a === "O") others.push({i:i, text:state.others[i]});
    else if (a) counts[a]++;
  });
  // Orden estable: en empate se respeta D, I, S, C
  var ranked = ORDER.slice().sort(function(a, b){ return counts[b] - counts[a]; });
  var p = ranked[0], s = ranked[1];
  return {counts:counts, primary:p, secondary:s, mixed:(counts[p] - counts[s]) <= 2, others:others, styled:TOTAL - others.length};
}

function resultText(r){
  var P = STYLES[r.primary], S = STYLES[r.secondary];
  return [
    CFG.testName + " · 1% Método NEO · By Oscar Triana",
    "",
    "Nombre: " + state.name,
    "Estilo principal: " + r.primary + " · " + P.profile + " (" + P.name + ")",
    "Estilo secundario: " + r.secondary + " · " + S.profile + " (" + S.name + ")",
    r.mixed ? "Perfil mixto " + r.primary + "/" + r.secondary : null,
    "",
    "Conteo (de " + TOTAL + "):",
    "D Dominante: " + r.counts.D,
    "I Influyente: " + r.counts.I,
    "S Estable: " + r.counts.S,
    "C Concienzudo: " + r.counts.C,
    r.others.length ? "Respuestas propias (Otro): " + r.others.length : null
  ].filter(function(l){ return l !== null; }).concat(
    r.others.length ? [""].concat(["Lo que haría diferente:"], r.others.map(function(o){
      return "- Situación " + (o.i + 1) + " (" + QUESTIONS[o.i].stage + "): " + o.text;
    })) : []
  ).join("\n");
}

function clientCard(k, opts){

    (r.mixed
      ? '<span>Perfil mixto ' + r.primary + '/' + r.secondary + ': tu lado ' + S.profile.replace("El ", "").toLowerCase() + ' está casi a la par.</span>'

    : '';

    ? '<p class="r-warn">Elegiste «Otro» en ' + r.others.length + ' situaciones, así que tu estilo se calculó con ' + r.styled + ' respuestas. Tómalo como una orientación y revísalo con tu líder.</p>'
    : '';

  function list(arr){ return arr.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join(""); }

/* ================= PDF: descarga directa ================= */
var PDF_LIBS = [
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
  "https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"
];
var pdfLibsPromise = null;
function loadScript(src){
  return new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = resolve;
    s.onerror = function(){ reject(new Error("No cargó " + src)); };
    document.head.appendChild(s);
  });
}
function loadPdfLibs(){
  if (!pdfLibsPromise){
    pdfLibsPromise = PDF_LIBS.reduce(function(p, src){ return p.then(function(){ return loadScript(src); }); }, Promise.resolve());
    pdfLibsPromise.catch(function(){ pdfLibsPromise = null; });
  }
  return pdfLibsPromise;
}

async function buildPdf(fileName){
  await loadPdfLibs();
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  var section = app.querySelector(".result");
  var stage = document.createElement("div");
  stage.className = "pdf-stage";
  stage.setAttribute("aria-hidden", "true");
  var pages = [];
  Array.prototype.forEach.call(section.querySelectorAll(".pg"), function(pg){
    if (pg.classList.contains("print-hide")) return;
    var page = document.createElement("div");
    page.className = "pdf-page";
    page.setAttribute("style", section.getAttribute("style") || "");
    page.appendChild(pg.cloneNode(true));
    stage.appendChild(page);
    pages.push(page);
  });
  document.body.appendChild(stage);
  try {
    var W = 794;
    var opts = {pixelRatio:2, quality:0.9, backgroundColor:"#0a0a0a", width:W};
    try { opts.fontEmbedCSS = await htmlToImage.getFontEmbedCSS(pages[0]); } catch(e){}
    await htmlToImage.toJpeg(pages[0], opts); // primer render de calentamiento (Safari)
    var pdf = new window.jspdf.jsPDF({unit:"mm", format:"a4", orientation:"portrait", compress:true});
    for (var i = 0; i < pages.length; i++){
      var img = await htmlToImage.toJpeg(pages[i], opts);
      var h = pages[i].offsetHeight;
      var dw = 210, dh = h * 210 / W;
      if (dh > 297){ dh = 297; dw = W * 297 / h; }
      if (i) pdf.addPage();
      pdf.setFillColor(10, 10, 10);
      pdf.rect(0, 0, 210, 297, "F");
      pdf.addImage(img, "JPEG", (210 - dw) / 2, 0, dw, dh);
    }
    pdf.save(fileName);
  } finally {
    stage.remove();
  }
}

/* ================= Router ================= */
function render(moveFocus){
  if (state.screen !== "test") app.innerHTML = "";
  if (state.screen === "intro") renderIntro();
  else if (state.screen === "test") renderTest(false);
  else renderResult();
  if (moveFocus){ scrollTop(); focusHeading(); }
}

render(false);
})();
